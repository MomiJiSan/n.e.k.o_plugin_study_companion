[project]
name = "study_companion"
version = "0.1.6"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
]

[tool.pytest.ini_options]
addopts = "--confcutdir=tests --basetemp=.pytest-tmp"
testpaths = ["tests"]

[tool.neko.build]
exclude_dirs = ["tests"]
exclude_files = [".git", ".coverage", "coverage.xml"]
