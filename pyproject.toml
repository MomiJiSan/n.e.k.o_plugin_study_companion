[project]
name = "study_companion"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "Pillow>=11,<12",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "pyright>=1.1.400,<2",
]

[tool.pytest.ini_options]
addopts = "--confcutdir=tests --basetemp=.pytest-tmp"
testpaths = ["tests"]

[tool.neko.build]
exclude_dirs = ["tests", "experimental", ".gitnexus"]
exclude_files = [".git", ".coverage", "coverage.xml"]
