name: Study Companion Ruff

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ruff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff (0.12.4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v5

      - name: Check lint baseline
        working-directory: ${{ github.workspace }}/..
        run: >-
          uvx ruff==0.12.4 check --ignore-noqa --isolated --target-version py311
          --line-length 120 --select E4,E7,E9,F,I --exclude vendor
          "${{ github.event.repository.name }}"
