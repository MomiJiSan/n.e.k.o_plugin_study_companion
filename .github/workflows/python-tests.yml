name: Python Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests (3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Install locked development dependencies
        run: uv sync --locked --group dev

      - name: Run Python test suite
        run: uv run --locked python -m pytest -q

      - name: Run cognitive V2 acceptance
        run: >
          uv run --locked python -m tools.cognitive_v2_acceptance
          --profile ci
          --report-dir "${{ runner.temp }}/cognitive-acceptance"

      - name: Upload cognitive V2 acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-v2-acceptance
          path: |
            ${{ runner.temp }}/cognitive-acceptance/cognitive-v2-acceptance.json
            ${{ runner.temp }}/cognitive-acceptance/cognitive-v2-acceptance.md
          if-no-files-found: warn
