name: Study Companion Mounted Integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mounted-integration:
    name: Mounted integration (${{ matrix.neko.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        neko:
          - name: latest-main
            ref: main
          - name: pinned-2026-08-27
            ref: 661a80f91b61dd8abb7565b837e2c1e61dd0d7ae
    env:
      PLUGIN_ID: study_companion
    steps:
      - name: Checkout plugin repository
        uses: actions/checkout@v4
        with:
          path: plugin-repo
          persist-credentials: false

      - name: Checkout N.E.K.O
        uses: actions/checkout@v4
        with:
          repository: MomiJiSan/N.E.K.O
          ref: ${{ matrix.neko.ref }}
          path: neko
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugin-repo/tests/frontend/package-lock.json

      - name: Mount plugin into N.E.K.O tree
        shell: bash
        run: |
          rm -rf "neko/plugin/plugins/${PLUGIN_ID}"
          mkdir -p neko/plugin/plugins
          cp -R plugin-repo "neko/plugin/plugins/${PLUGIN_ID}"

      - name: Sync plugin dependencies
        working-directory: neko
        run: uv run --with pip python -m plugin.neko_plugin_cli.cli sync "${PLUGIN_ID}" --clean

      - name: Run mounted plugin test suite
        working-directory: neko/plugin/plugins/${{ env.PLUGIN_ID }}
        run: >-
          PYTHONPATH="$PWD:$PWD/../../.." uv run --with pytest
          --with pytest-asyncio python -m pytest -q
          tests

      - name: Require notebook backend integration to run
        working-directory: neko/plugin/plugins/${{ env.PLUGIN_ID }}
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH="$PWD:$PWD/../../.." uv run --with pytest --with pytest-asyncio python -m pytest -q -rs \
            tests/test_notebook_backend.py | tee notebook-backend.txt
          if grep -Eqi '([0-9]+ skipped|SKIPPED)' notebook-backend.txt; then
            echo "Notebook backend integration must not be skipped in a mounted checkout." >&2
            exit 1
          fi

      - name: Install frontend type-check dependencies
        working-directory: neko/plugin/plugins/study_companion/tests/frontend
        run: npm ci

      - name: Type-check hosted surfaces against mounted N.E.K.O SDK
        working-directory: neko/plugin/plugins/study_companion/tests/frontend
        run: ./node_modules/.bin/tsc --project ../../tsconfig.mounted.json --noEmit

      - name: Plugin check
        working-directory: neko
        run: uv run python -m plugin.neko_plugin_cli.cli check "${PLUGIN_ID}"

      - name: Release plugin check
        working-directory: neko
        run: uv run python -m plugin.neko_plugin_cli.cli check -r "${PLUGIN_ID}"
