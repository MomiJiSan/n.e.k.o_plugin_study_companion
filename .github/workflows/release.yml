# Generated by neko-plugin
# managed-template: plugin-market-actions-v1
name: Release N.E.K.O Plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-gate:
    name: Cognitive release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - name: Install locked development dependencies
        run: uv sync --locked --group dev
      - name: Validate release gate contracts
        run: uv run --locked python -m pytest -q tests/test_cognitive_release_gates.py tests/test_cognitive_release_gate_cli.py
  release:
    needs: release-gate
    uses: Project-N-E-K-O/N.E.K.O/.github/workflows/plugin-market-release.yml@main
    with:
      plugin-id: study_companion
      neko-repository: Project-N-E-K-O/N.E.K.O
      neko-ref: main
