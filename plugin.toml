[plugin]
id = "study_companion"
name = "Study Companion"
description = "An adaptive study companion that can classify the screen, generate questions, evaluate answers, explain concepts, and summarize sessions."
short_description = "OCR, tutoring, and session summaries for study sessions."
keywords = ["study", "ocr", "tutor", "concept", "learning"]
version = "0.2.4"
type = "plugin"
entry = "plugin.plugins.study_companion:StudyCompanionPlugin"

[plugin.author]
name = "N.E.K.O Team"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.store]
enabled = true

[plugin_state]
backend = "memory"

[plugin_runtime]
enabled = true
auto_start = false

[study]
default_mode = "companion"
language = "zh-CN"
history_limit = 50
auto_open_ui = false # Deprecated compatibility field; lifecycle never opens external UI.

[study.pomodoro]
focus_minutes = 25
short_break_minutes = 5
long_break_minutes = 15
long_break_interval = 4
allow_skip_break = true
allow_custom_duration = true

[study.supervision]
enabled = true
remind_interval_minutes = 10
inactivity_timeout_minutes = 5
idle_away_seconds = 900
allow_disable_by_chat = true

[study.checkin]
streak_timezone = "local"
makeup_window_days = 3
auto_derive_from_session = true

[study.awareness]
enabled = false
snapshot_interval_seconds = 5
context_window_minutes = 5
classify_mode = "title_first"
image_max_bytes = 65536
push_to_llm_interval_seconds = 300
push_to_llm_mode = "read"
os_signals_enabled = true
distraction_detection = true

[study.adaptive_loop]
next_step_preview_enabled = true
material_learning_plans_enabled = false
auto_prepare_plan = true
max_core_topics = 12
max_prerequisite_topics = 5
auto_generate_next_question = false

# Cognitive Evidence Engine V2. Projection, reading, question intent, and UI
# are independent opt-ins and remain fail closed by default.
[cognitive]
projection_enabled = false
read_mode = "off" # off / shadow / active
intent_policy = "off" # off / shadow / on
ui_enabled = false
model_version = "cognitive-v1"
supported_topics = ["calculus.chain_rule", "college_chain_rule"]

[study_companion.communication]
enabled = true
solution_narration_enabled = true
general_narration_enabled = true

[llm]
llm_call_timeout_seconds = 120
llm_vision_enabled = false
llm_vision_max_image_px = 768
local_models_enabled = false
local_models_directory = ""

[ocr_reader]
enabled = true
capture_backend = "auto"
install_timeout_seconds = 300
left_inset_ratio = 0.03
right_inset_ratio = 0.03
top_ratio = 0.0
bottom_inset_ratio = 0.0

[rapidocr]
enabled = true
install_target_dir = ""
engine_type = "onnxruntime"
lang_type = "ch"
model_type = "mobile"
ocr_version = "PP-OCRv4"

[fsrs]
retention_target = 0.90
auto_optimize_interval_days = 30

[knowledge_contribution]
opt_in = false
min_sample_count = 3

[knowledge_retrieval]
relationship_v2_enabled = false

[doc_export]
enabled = false
pdf_backend = "reportlab"
default_style = "neko"
xmind_enabled = false

[plugin.ui]
enabled = true
expose_legacy_static_panel = false

[[plugin.ui.docs]]
id = "onboarding"
title = "Start with Study Companion"
entry = "onboarding.md"
permissions = ["state:read"]

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

[plugin.install]
enabled = true
ui_i18n_dir = "i18n"
tutorial_enabled = true

[plugin.install.kinds.rapidocr_models]
entry_id = "study_download_rapidocr_models"
label = "RapidOCR Models"
queued_message = "RapidOCR model download queued"
entry_timeout = 600.0
