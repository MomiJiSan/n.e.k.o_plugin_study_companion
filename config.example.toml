[plugin_runtime]
enabled = true
auto_start = false

[study.adaptive_loop]
next_step_preview_enabled = true
material_learning_plans_enabled = false
auto_prepare_plan = true
max_core_topics = 12
max_prerequisite_topics = 5
auto_generate_next_question = false

# Opt-in deterministic assessment routes.  Keep every route disabled until
# compatibility monitoring has approved a scoped rollout.
[assessment]
exact_short_answer_enabled = false
numeric_tolerance_enabled = false
math_expression_enabled = false

# Shadow mastery model.  The kill switch is v2_shadow_enabled; read_model
# remains V1 during the comparison period even when shadow projection is on.
[mastery]
v2_shadow_enabled = false
read_model = "v1"
model_version = "mastery-v2-shadow-1"

# Cognitive Evidence Engine V2. Every behavioral surface is independently
# disabled by default. V2 is bounded to one server-validated concept cluster.
[cognitive]
projection_enabled = false
read_mode = "off" # off / shadow / active
intent_policy = "off" # off / shadow / on
ui_enabled = false
model_version = "cognitive-v1"
supported_topics = ["calculus.chain_rule", "college_chain_rule"]
